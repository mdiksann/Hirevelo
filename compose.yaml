name: hirevelo
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hirevelo
      POSTGRES_PASSWORD: hirevelo_local
      POSTGRES_DB: hirevelo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirevelo -d hirevelo"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
